<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Signature de documents</title>
<style>
  :root{--moss:#33502E;--moss-dark:#233A20;--gold:#C89B3C;--gold-dark:#9E7A28;--bg:#F1EEE2;--card:#FFFFFF;--ink:#2B2B24;--ink-soft:#66655B;--line:#DAD6C6;--red:#A32638;--radius:12px;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  .wrap{max-width:560px;margin:0 auto;padding:0 0 60px;}
  header.top{background:var(--moss);color:#fff;padding:22px 20px 20px;}
  header.top h1{margin:0;font-size:22px;}
  header.top p{margin:4px 0 0;font-size:13px;opacity:.8;}
  main{padding:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .stack>*+*{margin-top:14px;}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;margin:22px 0 10px 4px;}
  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  input[type=text],input[type=number]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;font-size:16px;background:#FBFAF6;color:var(--ink);}
  input[type=file]{width:100%;font-size:14px;}
  .btn{width:100%;padding:14px;border-radius:9px;border:none;font-size:16px;font-weight:700;cursor:pointer;}
  .btn-gold{background:var(--gold);color:#3A2C0E;}
  .btn-ghost{background:transparent;color:var(--moss);border:1px solid var(--line);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .hidden{display:none;}
  .doc-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px;}
  .doc-item:last-child{border-bottom:none;}
  .cb{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;color:var(--ink);}
  .cb input{width:auto;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Signature de documents</h1>
    <p>Import en masse, signature, tampon et date du jour</p>
  </header>
  <main id="app"></main>
</div>
<script>
(function(){
if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }

// ---------- stockage local (navigateur uniquement) ----------
function lsGet(k, def){ try{ var v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); }catch(e){ return def; } }
function lsSet(k, v){ try{ if(v === null || v === undefined) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

// ---------- utilitaires ----------
function normalize(s){ return (s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function todayISO(){ var d = new Date(); var m = String(d.getMonth()+1).padStart(2,'0'), j = String(d.getDate()).padStart(2,'0'); return d.getFullYear()+'-'+m+'-'+j; }
function frDate(iso){ var p = iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function base64ToBytes(b64){ var bin = atob(b64); var arr = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i); return arr; }
function fileToBase64(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){ resolve(String(r.result).split(',')[1]); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function readAsDataURL(file){
  return new Promise(function(resolve){ var r = new FileReader(); r.onload = function(){ resolve(r.result); }; r.readAsDataURL(file); });
}
function imageToPngDataUrl(dataUrl){
  return new Promise(function(resolve){
    var im = new Image();
    im.onload = function(){ try{ var cv = document.createElement('canvas'); cv.width = im.naturalWidth; cv.height = im.naturalHeight; cv.getContext('2d').drawImage(im,0,0); resolve(cv.toDataURL('image/png')); }catch(e){ resolve(dataUrl); } };
    im.onerror = function(){ resolve(dataUrl); };
    im.src = dataUrl;
  });
}
function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
}

function makeSignaturePad(canvas){
  var ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a1a1a';
  var drawing = false, has = false;
  function pos(e){ var r = canvas.getBoundingClientRect(); return { x:(e.clientX-r.left)*canvas.width/r.width, y:(e.clientY-r.top)*canvas.height/r.height }; }
  canvas.style.touchAction = 'none';
  canvas.addEventListener('pointerdown', function(e){ e.preventDefault(); drawing = true; has = true; try{ canvas.setPointerCapture(e.pointerId); }catch(err){} var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+0.1,p.y+0.1); ctx.stroke(); });
  canvas.addEventListener('pointermove', function(e){ if(!drawing) return; e.preventDefault(); var p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  function end(){ drawing = false; }
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  return {
    isEmpty: function(){ return !has; },
    clear: function(){ ctx.clearRect(0,0,canvas.width,canvas.height); has = false; },
    toDataURL: function(){ return canvas.toDataURL('image/png'); }
  };
}

async function pdfFingerprint(b64){
  try{
    var pdf = await pdfjsLib.getDocument({ data: base64ToBytes(b64) }).promise;
    var pg = await pdf.getPage(1);
    var tc = await pg.getTextContent();
    var words = normalize(tc.items.map(function(i){ return i.str; }).join(' ')).replace(/[^a-z\s]/g,' ').split(/\s+/).filter(function(w){ return w.length >= 4; }).slice(0,6);
    return pdf.numPages + '|' + words.join(' ');
  }catch(e){ return '?|'; }
}

// positions en fractions (0-1) depuis le haut-gauche
async function stampPdf(b64, sigDataUrl, pos, lineText, pageNum, tampon){
  var pdfDoc = await PDFLib.PDFDocument.load(base64ToBytes(b64), { ignoreEncryption: true });
  var pages = pdfDoc.getPages();
  var idx = (pageNum && pageNum >= 1 && pageNum <= pages.length) ? pageNum - 1 : pages.length - 1;
  var page = pages[idx];
  var size = page.getSize();
  var img = await pdfDoc.embedPng(sigDataUrl);
  var boxW = size.width * 0.22;
  var boxH = img.height * (boxW / img.width);
  var x = Math.max(0, Math.min(size.width - boxW, pos.x * size.width - boxW/2));
  var y = Math.max(0, Math.min(size.height - boxH, size.height - pos.y * size.height - boxH/2));
  page.drawImage(img, { x:x, y:y, width:boxW, height:boxH });
  if(lineText){
    var font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    page.drawText(lineText, { x:x, y:Math.min(size.height - 10, y + boxH + 2), size:8, font:font, color:PDFLib.rgb(0.1,0.1,0.1) });
  }
  if(tampon && tampon.png && tampon.pos){
    var timg = await pdfDoc.embedPng(tampon.png);
    var tw = size.width * 0.2, th = timg.height * (tw / timg.width);
    var tx = Math.max(0, Math.min(size.width - tw, tampon.pos.x * size.width - tw/2));
    var ty = Math.max(0, Math.min(size.height - th, size.height - tampon.pos.y * size.height - th/2));
    page.drawImage(timg, { x:tx, y:ty, width:tw, height:th });
  }
  return await pdfDoc.save();
}

async function buildPositionPicker(host, b64, pageNum, markers, initial){
  var pdf = await pdfjsLib.getDocument({ data: base64ToBytes(b64) }).promise;
  var pn = (pageNum && pageNum >= 1 && pageNum <= pdf.numPages) ? pageNum : pdf.numPages;
  var page = await pdf.getPage(pn);
  var vp0 = page.getViewport({ scale: 1 });
  var vp = page.getViewport({ scale: Math.min(1.4, 640 / vp0.width) });
  host.innerHTML =
    '<div style="margin-bottom:6px;">' + markers.map(function(m,i){ return '<label style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:13px;"><input type="radio" name="pk_'+host.id+'" value="'+m.key+'" style="width:auto;"'+(i===0?' checked':'')+'> <span style="color:'+m.color+';font-weight:700;">■</span> '+m.label+'</label>'; }).join('') + '</div>' +
    '<div style="position:relative;display:inline-block;max-width:100%;"><canvas style="max-width:100%;border:1px solid var(--line);cursor:crosshair;"></canvas><div class="pkLayer" style="position:absolute;inset:0;pointer-events:none;"></div></div>' +
    '<p class="muted" style="margin-top:4px;">Cliquez sur la page à l\'endroit voulu pour chaque élément (page '+pn+'/'+pdf.numPages+').</p>';
  var cv = host.querySelector('canvas');
  cv.width = vp.width; cv.height = vp.height;
  await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  var layer = host.querySelector('.pkLayer');
  var positions = {};
  if(initial){ Object.keys(initial).forEach(function(k){ if(initial[k]) positions[k] = { x:initial[k].x, y:initial[k].y }; }); }
  function draw(){
    layer.innerHTML = markers.map(function(m){
      var p = positions[m.key]; if(!p) return '';
      return '<div style="position:absolute;left:'+(p.x*100-11)+'%;top:'+(p.y*100)+'%;width:22%;height:8%;transform:translateY(-50%);border:2px dashed '+m.color+';background:'+m.color+'22;font-size:10px;color:'+m.color+';font-weight:700;">'+m.label+'</div>';
    }).join('');
  }
  cv.addEventListener('click', function(e){
    var r = cv.getBoundingClientRect();
    var sel = host.querySelector('input[type=radio]:checked').value;
    positions[sel] = { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height };
    draw();
  });
  draw();
  return { positions: positions };
}

// ---------- écran ----------
var app = document.getElementById('app');
var savedSig = lsGet('sig_image', null);
var tamponPng = lsGet('sig_tampon', null);
var layouts = lsGet('sig_layouts', {});
var lieuDef = lsGet('sig_lieu', '');
var files = [];   // {file,b64,fp}
var groups = [];  // {fp,idxs,label,picker}

app.innerHTML =
  '<div class="card"><p class="muted" style="margin:0;">Tout se passe dans votre navigateur : vos documents, votre signature et votre tampon ne sont envoyés à aucun serveur. Ils sont mémorisés sur cet appareil uniquement (si vous effacez les données du navigateur, il faudra les remettre).</p></div>' +

  '<div class="section-title">1. Vos documents (PDF)</div>' +
  '<div class="card stack">' +
    '<div><label>Attestations / documents à signer (plusieurs à la fois)</label><input type="file" id="sgFiles" accept="application/pdf" multiple></div>' +
    '<div id="sgList"></div>' +
  '</div>' +

  '<div class="section-title">2. Emplacements (par modèle de document)</div>' +
  '<div id="sgGroups"><div class="card"><p class="muted" style="margin:0;">Importez des documents : un aperçu par modèle apparaît ici. Les emplacements choisis sont mémorisés pour la prochaine fois.</p></div></div>' +

  '<div class="section-title">3. Votre signature et votre tampon</div>' +
  '<div class="card stack">' +
    '<div><label>Lieu (« Fait à … »)</label><input type="text" id="sgLieu" value="'+esc(lieuDef)+'" placeholder="Ville"></div>' +
    '<p style="margin:0;">Date apposée : <strong>'+frDate(todayISO())+'</strong> (aujourd\'hui)</p>' +
    '<div id="sgSavedWrap" class="'+(savedSig?'':'hidden')+'">' +
      '<img id="sgSavedImg" src="'+(savedSig||'')+'" style="max-height:70px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px;">' +
      '<label class="cb" style="margin-top:6px;"><input type="checkbox" id="sgUseSaved" checked> Utiliser ma signature mémorisée sur cet appareil</label>' +
      '<button class="btn btn-ghost" id="sgForget" style="margin-top:6px;">Oublier cette signature</button>' +
    '</div>' +
    '<div id="sgDrawWrap" class="'+(savedSig?'hidden':'')+'">' +
      '<label>Dessinez votre signature (doigt ou souris)</label>' +
      '<canvas id="sgCanvas" width="500" height="150" style="border:1px solid var(--line);border-radius:8px;width:100%;max-width:500px;background:#fff;"></canvas>' +
      '<button class="btn btn-ghost" id="sgClear" style="margin-top:6px;">Effacer</button>' +
      '<label class="cb" style="margin-top:6px;"><input type="checkbox" id="sgRemember"> Mémoriser ma signature sur cet appareil</label>' +
    '</div>' +
    '<div><label>Tampon de la société (image)</label><input type="file" id="sgTamponFile" accept="image/*">' +
      '<div id="sgTamponPrev" style="margin-top:6px;">'+(tamponPng?'<img src="'+tamponPng+'" style="max-height:80px;">':'<span class="muted">Aucun tampon enregistré.</span>')+'</div>' +
      (tamponPng ? '<button class="btn btn-ghost" id="sgTamponDel" style="margin-top:6px;">Supprimer le tampon mémorisé</button>' : '<button class="btn btn-ghost hidden" id="sgTamponDel" style="margin-top:6px;">Supprimer le tampon mémorisé</button>') +
    '</div>' +
  '</div>' +
  '<button class="btn btn-gold" id="sgGo">Signer, dater, tamponner et télécharger</button>' +
  '<div id="sgRes" class="muted" style="text-align:center;margin-top:8px;"></div>';

var pad = makeSignaturePad(document.getElementById('sgCanvas'));
document.getElementById('sgClear').onclick = function(){ pad.clear(); };
document.getElementById('sgUseSaved').addEventListener('change', function(){ document.getElementById('sgDrawWrap').classList.toggle('hidden', this.checked); });
document.getElementById('sgForget').onclick = function(){
  if(!confirm('Oublier la signature mémorisée sur cet appareil ?')) return;
  lsSet('sig_image', null); savedSig = null;
  document.getElementById('sgSavedWrap').classList.add('hidden');
  document.getElementById('sgDrawWrap').classList.remove('hidden');
};

function markersList(){
  var mk = [{ key:'signature', label:'Signature', color:'#33502E' }];
  if(tamponPng) mk.push({ key:'tampon', label:'Tampon', color:'#1F5FA8' });
  return mk;
}
async function buildGroupPicker(gi){
  var g = groups[gi];
  var pg = parseInt(document.getElementById('grpPage_'+gi).value,10) || null;
  var initial = g.picker ? g.picker.positions : ((layouts[g.fp] && layouts[g.fp].pos) || {});
  g.picker = await buildPositionPicker(document.getElementById('pickGrp_'+gi), files[g.idxs[0]].b64, pg, markersList(), initial);
}
async function renderGroups(){
  var host = document.getElementById('sgGroups');
  if(!groups.length) return;
  host.innerHTML = groups.map(function(g, gi){
    var saved = layouts[g.fp];
    return '<div class="card stack">' +
      '<div><label>Modèle de document ('+g.idxs.length+' fichier(s))</label><input type="text" id="grpLabel_'+gi+'" value="'+esc(g.label||'')+'"></div>' +
      '<div style="font-size:13px;color:'+(saved?'var(--moss)':'var(--red)')+';">'+(saved?'✓ emplacement mémorisé pour ce modèle — vérifiez l\'aperçu':'Emplacement à placer (sera mémorisé)')+'</div>' +
      '<div><label>Page de signature (vide = dernière page)</label><input type="number" id="grpPage_'+gi+'" min="1" placeholder="dernière" value="'+((saved&&saved.page)||'')+'"></div>' +
      '<div id="pickGrp_'+gi+'"></div>' +
    '</div>';
  }).join('');
  for(var gi=0; gi<groups.length; gi++){
    (function(g2){ document.getElementById('grpPage_'+g2).addEventListener('change', function(){ buildGroupPicker(g2); }); })(gi);
    await buildGroupPicker(gi);
  }
}

document.getElementById('sgTamponFile').addEventListener('change', async function(e){
  var f = e.target.files[0]; if(!f) return;
  tamponPng = await imageToPngDataUrl(await readAsDataURL(f));
  if(!lsSet('sig_tampon', tamponPng)){ alert('Image trop lourde pour être mémorisée : elle sera utilisée pour cette session seulement.'); }
  document.getElementById('sgTamponPrev').innerHTML = '<img src="'+tamponPng+'" style="max-height:80px;">';
  document.getElementById('sgTamponDel').classList.remove('hidden');
  await renderGroups();
});
document.getElementById('sgTamponDel').onclick = async function(){
  lsSet('sig_tampon', null); tamponPng = null;
  document.getElementById('sgTamponPrev').innerHTML = '<span class="muted">Aucun tampon enregistré.</span>';
  this.classList.add('hidden');
  await renderGroups();
};

document.getElementById('sgFiles').addEventListener('change', async function(e){
  var list = Array.from(e.target.files);
  var listEl = document.getElementById('sgList');
  listEl.innerHTML = '<p class="muted">Analyse en cours…</p>';
  files = []; groups = [];
  for(var i=0;i<list.length;i++){
    var b64 = await fileToBase64(list[i]);
    files.push({ file: list[i], b64: b64, fp: await pdfFingerprint(b64) });
  }
  files.forEach(function(c, i){
    var g = groups.find(function(x){ return x.fp === c.fp; });
    if(!g){ g = { fp:c.fp, idxs:[], label:(layouts[c.fp] && layouts[c.fp].label) || ('Modèle : '+c.file.name.replace(/\.pdf$/i,'')), picker:null }; groups.push(g); }
    g.idxs.push(i);
  });
  listEl.innerHTML = files.map(function(c){ return '<div class="doc-item"><span>'+esc(c.file.name)+'</span></div>'; }).join('') + '<p class="muted" style="margin:8px 0 0;">'+files.length+' document(s), '+groups.length+' modèle(s).</p>';
  await renderGroups();
});

document.getElementById('sgGo').onclick = async function(){
  var btn = this;
  if(!files.length){ alert('Importez d\'abord des documents PDF.'); return; }
  if(!window.PDFLib || !window.JSZip){ alert('Bibliothèques non chargées, rechargez la page.'); return; }
  var useSaved = !!savedSig && document.getElementById('sgUseSaved').checked;
  if(!useSaved && pad.isEmpty()){ alert('Dessinez d\'abord votre signature.'); return; }
  var lieu = document.getElementById('sgLieu').value.trim();
  if(!lieu){ alert('Indiquez le lieu (« Fait à … »).'); return; }
  for(var gi=0; gi<groups.length; gi++){
    var pos = groups[gi].picker && groups[gi].picker.positions;
    var lab = document.getElementById('grpLabel_'+gi).value;
    if(!pos || !pos.signature){ alert('« '+lab+' » : cliquez sur l\'aperçu pour placer la signature.'); return; }
    if(tamponPng && !pos.tampon){ alert('« '+lab+' » : placez aussi le tampon (choisissez « Tampon » au-dessus de l\'aperçu).'); return; }
  }
  var dateStr = frDate(todayISO());
  if(!confirm('Apposer VOTRE signature'+(tamponPng?' et le tampon':'')+', datée du '+dateStr+', sur '+files.length+' document(s) ?')) return;

  var sig = useSaved ? savedSig : pad.toDataURL();
  if(!useSaved && document.getElementById('sgRemember').checked){ lsSet('sig_image', sig); }
  lsSet('sig_lieu', lieu);
  var res = document.getElementById('sgRes');
  btn.disabled = true;
  var out = [], errs = [];
  for(var i=0;i<files.length;i++){
    var c = files[i];
    var g = groups.find(function(x){ return x.idxs.indexOf(i) !== -1; });
    var gIdx = groups.indexOf(g);
    var pg = parseInt(document.getElementById('grpPage_'+gIdx).value,10) || null;
    res.textContent = 'Signature '+(i+1)+'/'+files.length+'…';
    try{
      var bytes = await stampPdf(c.b64, sig, g.picker.positions.signature, 'Fait à '+lieu+', le '+dateStr, pg, tamponPng ? { png:tamponPng, pos:g.picker.positions.tampon } : null);
      out.push({ name: c.file.name.replace(/\.pdf$/i,'') + '_signe.pdf', bytes: bytes });
    }catch(err){ errs.push(c.file.name+' : '+err.message); }
  }
  // mémorise les emplacements par modèle
  groups.forEach(function(g2, gi2){
    layouts[g2.fp] = { label: document.getElementById('grpLabel_'+gi2).value, pos: g2.picker.positions, page: parseInt(document.getElementById('grpPage_'+gi2).value,10) || null };
  });
  lsSet('sig_layouts', layouts);

  if(out.length === 1){
    downloadBlob(new Blob([out[0].bytes], { type:'application/pdf' }), out[0].name);
  } else if(out.length > 1){
    var zip = new JSZip(); var used = {};
    out.forEach(function(o){ var n = o.name; if(used[n]){ used[n]++; n = used[o.name]+'_'+n; } else used[n] = 1; zip.file(n, o.bytes); });
    downloadBlob(await zip.generateAsync({ type:'blob' }), 'Documents_signes_'+todayISO()+'.zip');
  }
  res.textContent = out.length+' document(s) signé(s) et téléchargé(s)'+(errs.length?' — erreurs : '+errs.join(' ; '):'')+'.';
  btn.disabled = false;
};
})();
</script>
</body>
</html>
