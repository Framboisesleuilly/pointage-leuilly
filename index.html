<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pointage — Mont de Leuilly</title>
<style>
  :root{
    --moss:#33502E;
    --moss-dark:#233A20;
    --gold:#C89B3C;
    --gold-dark:#9E7A28;
    --bg:#F1EEE2;
    --card:#FFFFFF;
    --ink:#2B2B24;
    --ink-soft:#66655B;
    --line:#DAD6C6;
    --red:#A32638;
    --red-bg:#F7E6E8;
    --green-bg:#E9F0E1;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 0 60px;}
  header.top{background:var(--moss);color:#fff;padding:22px 20px 20px;position:relative;}
  header.top .brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin:0 0 4px;}
  header.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;}
  .rows{display:flex;flex-direction:row;justify-content:space-between;align-items:center;}
  .btn-quit{background:rgba(255,255,255,.12);border:none;color:#fff;font-size:13px;padding:8px 12px;border-radius:8px;cursor:pointer;}
  main{padding:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .stack>*+*{margin-top:14px;}
  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  input[type=text],input[type=date],input[type=time],input[type=number],input[type=password]{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;font-size:16px;background:#FBFAF6;color:var(--ink);
  }
  input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .btn{width:100%;padding:14px;border-radius:9px;border:none;font-size:16px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--moss);color:#fff;}
  .btn-primary:active{background:var(--moss-dark);}
  .btn-gold{background:var(--gold);color:#3A2C0E;}
  .btn-gold:active{background:var(--gold-dark);}
  .btn-ghost{background:transparent;color:var(--moss);border:1px solid var(--line);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .banner{background:var(--red-bg);color:var(--red);padding:12px 14px;border-radius:9px;font-size:14px;font-weight:600;margin-bottom:16px;}
  .banner.ok{background:var(--green-bg);color:#33502E;}
  .total-line{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:1px solid var(--line);}
  .total-line .val{font-size:26px;font-weight:700;color:var(--moss);}
  .hist-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-date{color:var(--ink-soft);}
  .hist-total{font-weight:700;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700;margin:22px 0 10px 4px;}
  .worker-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .worker-row:last-child{border-bottom:none;}
  .worker-name{font-weight:600;}
  .worker-hours{color:var(--moss);font-weight:700;}
  .link-row{text-align:center;margin-top:14px;font-size:14px;color:var(--moss-dark);text-decoration:underline;cursor:pointer;}
  .home-btn{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:14px;text-align:left;cursor:pointer;}
  .home-btn .t{font-size:17px;font-weight:700;color:var(--moss);}
  .home-btn .s{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .hidden{display:none !important;}
  .nav-menu{position:absolute;top:64px;right:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);overflow:hidden;z-index:50;min-width:180px;}
  .nav-menu button{display:block;width:100%;text-align:left;padding:14px 16px;border:none;background:none;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line);}
  .nav-menu button:last-child{border-bottom:none;}
  .doc-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .doc-item:last-child{border-bottom:none;}
  .label-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .label-card{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;background:#fff;}
  .label-card .qr{display:flex;justify-content:center;margin-bottom:6px;}
  .label-card .num{font-size:20px;font-weight:800;color:var(--moss);}
  .scanner-overlay{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;}
  .scanner-overlay video{flex:1;width:100%;object-fit:cover;}
  .scanner-overlay .scanner-bar{padding:16px;background:var(--moss-dark);display:flex;justify-content:space-between;align-items:center;}
  .scanner-overlay .scanner-bar span{color:#fff;font-weight:600;}
  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    .wrap{max-width:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="rows">
      <div>
        <p class="brand">Mont de Leuilly</p>
        <h1 id="headerTitle">Pointage</h1>
      </div>
      <button class="btn-quit hidden" id="btnMenu" style="margin-right:8px;">☰</button>
      <button class="btn-quit hidden" id="btnQuit">Quitter</button>
    </div>
  </header>
  <div id="navMenu" class="hidden nav-menu">
    <button data-go="workerDash">Pointages</button>
    <button data-go="workerRapport">Rapport</button>
    <button id="navTriBtn" data-go="sorterEntry" class="hidden">Tri</button>
    <button data-go="workerDocs">Documents</button>
    <button data-go="workerParams">Paramètres</button>
  </div>
  <main id="app"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
<script>
(function(){

var app = document.getElementById('app');
var headerTitle = document.getElementById('headerTitle');
var btnQuit = document.getElementById('btnQuit');
var btnMenu = document.getElementById('btnMenu');
var navMenu = document.getElementById('navMenu');
var ADMIN_CODE = "LEUILLY2026";

var WORKER_SCREENS = ['workerDash','workerRapport','workerDocs','workerParams','sorterEntry'];

async function getDocuments(workerId){
  try{ var r = await fetch('/api/documents?workerId='+encodeURIComponent(workerId)); return r.ok ? await r.json() : []; }catch(err){ return []; }
}
async function saveDocuments(workerId, docs){
  await fetch('/api/documents?workerId='+encodeURIComponent(workerId), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(docs)});
}
async function getValidations(workerId){
  try{ var r = await fetch('/api/validations?workerId='+encodeURIComponent(workerId)); return r.ok ? await r.json() : {}; }catch(err){ return {}; }
}
async function saveValidations(workerId, validations){
  await fetch('/api/validations?workerId='+encodeURIComponent(workerId), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(validations)});
}
async function getBarquettes(date){
  try{ var r = await fetch('/api/barquettes?date='+date); return r.ok ? await r.json() : []; }catch(err){ return []; }
}
async function saveBarquettes(date, list){
  try{
    var r = await fetch('/api/barquettes?date='+date, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(list)});
    return r.ok;
  }catch(err){ return false; }
}
async function getSecteurs(){
  try{ var r = await fetch('/api/secteurs'); return r.ok ? await r.json() : []; }catch(err){ return []; }
}
async function saveSecteurs(list){
  try{ var r = await fetch('/api/secteurs', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(list)}); return r.ok; }catch(err){ return false; }
}
async function getParcelleLog(date){
  try{ var r = await fetch('/api/parcelle?date='+date); return r.ok ? await r.json() : []; }catch(err){ return []; }
}
async function saveParcelleLog(date, list){
  try{ var r = await fetch('/api/parcelle?date='+date, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(list)}); return r.ok; }catch(err){ return false; }
}
async function getBonsApport(){
  try{ var r = await fetch('/api/bons-apport'); return r.ok ? await r.json() : []; }catch(err){ return []; }
}
async function saveBonsApport(list){
  try{ var r = await fetch('/api/bons-apport', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(list)}); return r.ok; }catch(err){ return false; }
}
async function getSorters(){
  try{ var r = await fetch('/api/sorters'); return r.ok ? await r.json() : []; }catch(err){ return []; }
}
async function saveSorters(list){
  await fetch('/api/sorters', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(list)});
}
function fileToBase64(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result.split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function ensureCompatibleImage(file){
  var isHeic = /heic|heif/i.test(file.type) || /\.hei[cf]$/i.test(file.name||'');
  if(!isHeic || !window.heic2any) return file;
  try{
    var converted = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.9 });
    var blob = Array.isArray(converted) ? converted[0] : converted;
    return new File([blob], (file.name||'photo').replace(/\.hei[cf]$/i, '.jpg'), { type: 'image/jpeg' });
  }catch(err){
    return file; // en cas d'échec de conversion, on tente quand même l'envoi tel quel
  }
}

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
async function extractPdfText(file){
  try{
    var buf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    var text = '';
    for(var p=1; p<=pdf.numPages; p++){
      var page = await pdf.getPage(p);
      var content = await page.getTextContent();
      text += content.items.map(function(it){ return it.str; }).join(' ') + ' ';
    }
    return text;
  }catch(err){ return ''; }
}
function findWorkerInText(rawText, workers){
  var norm = normalize(rawText);
  for(var i=0;i<workers.length;i++){
    var w = workers[i];
    if(!w.key) continue;
    var re = new RegExp('(^|[^a-z])'+w.key+'([^a-z]|$)', 'i');
    if(re.test(norm)) return w;
  }
  return null;
}
function extractPeriodLabel(rawText){
  var m = rawText.match(/[Dd]u\s+(\d{2})\/(\d{2})\/(\d{4})\s+au/);
  if(!m) return null;
  var moisNoms = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
  return moisNoms[parseInt(m[2],10)-1] + '-' + m[3];
}
function extractPayrollInfo(rawText){
  var info = { netAPayer: null, cotisations: null, heuresBulletin: null };
  var mNet = rawText.match(/Montant net à payer\s*:\s*([\d]+[.,][\d]{2})/);
  if(mNet) info.netAPayer = parseFloat(mNet[1].replace(',','.'));
  var mCot = rawText.match(/Total des cotisations et contributions obligatoires\s+([\d]+[.,][\d]{2})/);
  if(mCot) info.cotisations = parseFloat(mCot[1].replace(',','.'));
  var mH = rawText.match(/Nombre total d'heures\s+([\d]+[.,][\d]{2})/);
  if(mH) info.heuresBulletin = parseFloat(mH[1].replace(',','.'));
  return info;
}

var state = { screen:'home', worker:null, sorter:null, editDate:null, expandedMonth:null, sorterDate:null, adminBarqDate:null, sorterEditIdx:null, adminMonthFilter:'all', parcelleDate:null, parcelleEditSecteur:null, agroVueGroupBy:'secteur', agroVueDays:30, rythmeDate:null, rythmeSortBy:'kg' };

function todayISO(){ var d = new Date(); return d.toISOString().slice(0,10); }
function frDate(iso){ var p = iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function round2(n){ return Math.round(n*100)/100; }
function cueilleurLabel(n){ return (parseInt(n,10)===0) ? 'Non identifié (sans papier)' : 'Cueilleur n°'+n; }
function timeToDecimal(t){ if(!t) return null; var parts = t.split(':'); return parseInt(parts[0],10) + parseInt(parts[1],10)/60; }

function computeTotal(e){
  if(!e.matinDebut || !e.matinFin) return null;
  var m = timeToDecimal(e.matinFin) - timeToDecimal(e.matinDebut);
  var a = 0;
  if(e.apremDebut && e.apremFin){ a = timeToDecimal(e.apremFin) - timeToDecimal(e.apremDebut); }
  var pause = (parseFloat(e.pause)||0)/60;
  var total = m + a - pause;
  if(total < 0) total = 0;
  return round2(total);
}

async function getWorkers(){
  try{ var r = await fetch('/api/workers'); return r.ok ? await r.json() : []; }catch(err){ return []; }
}
async function saveWorkers(list){
  await fetch('/api/workers', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(list)});
}
async function getEntries(workerId){
  try{ var r = await fetch('/api/entries?workerId='+encodeURIComponent(workerId)); return r.ok ? await r.json() : {}; }catch(err){ return {}; }
}
async function saveEntries(workerId, entries){
  await fetch('/api/entries?workerId='+encodeURIComponent(workerId), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(entries)});
}
function normalize(s){
  return (s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function render(){
  btnQuit.classList.toggle('hidden', state.screen==='home');
  var showMenu = WORKER_SCREENS.indexOf(state.screen) !== -1;
  btnMenu.classList.toggle('hidden', !showMenu);
  navMenu.classList.add('hidden');
  var navTriBtn = document.getElementById('navTriBtn');
  if(navTriBtn) navTriBtn.classList.toggle('hidden', !(state.worker && state.worker.isTrieur));
  if(state.screen==='home') return renderHome();
  if(state.screen==='workerLogin') return renderWorkerLogin();
  if(state.screen==='sorterEntry') return renderSorterEntry();
  if(state.screen==='workerDash') return renderWorkerDash();
  if(state.screen==='workerRapport') return renderWorkerRapport();
  if(state.screen==='workerDocs') return renderWorkerDocs();
  if(state.screen==='workerParams') return renderWorkerParams();
  if(state.screen==='adminLogin') return renderAdminLogin();
  if(state.screen==='adminMenu') return renderAdminMenu();
  if(state.screen==='adminAgroMenu') return renderAdminAgroMenu();
  if(state.screen==='adminSecteurs') return renderAdminSecteurs();
  if(state.screen==='adminParcelleCalendar') return renderAdminParcelleCalendar();
  if(state.screen==='adminVentes') return renderAdminVentes();
  if(state.screen==='adminAgroVue') return renderAdminAgroVue();
  if(state.screen==='adminDash') return renderAdminDash();
  if(state.screen==='adminWorkerDetail') return renderAdminWorkerDetail();
  if(state.screen==='adminBulkImport') return renderAdminBulkImport();
  if(state.screen==='adminPayroll') return renderAdminPayroll();
  if(state.screen==='adminBarquettes') return renderAdminBarquettes();
  if(state.screen==='adminRythme') return renderAdminRythme();
  if(state.screen==='adminNewWorker') return renderAdminNewWorker();
  if(state.screen==='adminImportHours') return renderAdminImportHours();
}

btnMenu.onclick = function(){ navMenu.classList.toggle('hidden'); };
navMenu.querySelectorAll('button[data-go]').forEach(function(btn){
  btn.onclick = function(){
    state.screen = btn.getAttribute('data-go');
    state.editDate = null;
    navMenu.classList.add('hidden');
    render();
  };
});

function renderHome(){
  headerTitle.textContent = 'Pointage';
  app.innerHTML =
    '<button class="home-btn" id="goWorker">' +
      '<div class="t">Je suis salarié</div>' +
      '<div class="s">Remplir mes heures du jour</div>' +
    '</button>' +
    '<button class="home-btn" id="goAdmin">' +
      '<div class="t">Espace responsable</div>' +
      '<div class="s">Voir et exporter les heures de l\'équipe</div>' +
    '</button>';
  document.getElementById('goWorker').onclick = function(){ state.screen='workerLogin'; render(); };
  document.getElementById('goAdmin').onclick = function(){ state.screen='adminLogin'; render(); };
}

function renderWorkerLogin(){
  headerTitle.textContent = 'Connexion';
  app.innerHTML =
    '<div class="card stack">' +
      '<div><label>Prénom</label><input type="text" id="fPrenom" placeholder="Ton prénom"></div>' +
      '<div><label>Date de naissance</label><input type="date" id="fDob"></div>' +
      '<div><label>Email (pour ton récap hebdomadaire)</label><input type="text" id="fEmail" placeholder="toi@exemple.fr"></div>' +
      '<div id="loginErr" class="banner hidden"></div>' +
      '<button class="btn btn-primary" id="btnLogin">Se connecter</button>' +
    '</div>';
  document.getElementById('btnLogin').onclick = async function(){
    var prenom = document.getElementById('fPrenom').value.trim();
    var dob = document.getElementById('fDob').value;
    var email = document.getElementById('fEmail').value.trim();
    var errEl = document.getElementById('loginErr');
    if(!prenom || !dob){
      errEl.textContent = 'Entre ton prénom et ta date de naissance.';
      errEl.classList.remove('hidden');
      return;
    }
    var workers = await getWorkers();
    var key = normalize(prenom);
    var existing = workers.find(function(w){ return w.key===key; });
    if(existing){
      if(existing.dob !== dob){
        errEl.textContent = 'Prénom ou date de naissance incorrect.';
        errEl.classList.remove('hidden');
        return;
      }
      if(email && existing.email !== email){ existing.email = email; await saveWorkers(workers); }
      state.worker = existing;
    } else {
      var w = { id: key+'-'+Date.now(), key:key, prenom:prenom, dob:dob, email:email };
      workers.push(w);
      await saveWorkers(workers);
      state.worker = w;
    }
    state.editDate = null;
    state.screen = 'workerDash';
    render();
  };
}

async function renderWorkerDash(){
  headerTitle.textContent = state.worker.prenom;
  app.innerHTML = '<p class="muted">Chargement…</p>';
  var entries = await getEntries(state.worker.id);
  var validations = await getValidations(state.worker.id);
  var today = todayISO();
  var editDate = state.editDate || today;
  var isToday = editDate === today;
  var lockedMonth = validations[editDate.slice(0,7)] || null;
  var current = entries[editDate] || {};
  var alreadyFilled = current.matinDebut && current.matinFin;
  var wasEdited = current.history && current.history.length > 0;

  var html = '';
  if(lockedMonth){
    html += '<div class="banner">Ce mois a été validé et signé le '+new Date(lockedMonth.validatedAt).toLocaleDateString('fr-FR')+'. Contacte le responsable pour toute correction.</div>';
  } else if(isToday && !alreadyFilled){
    html += '<div class="banner">N\'oublie pas de remplir tes heures aujourd\'hui !</div>';
  } else if(isToday){
    html += '<div class="banner ok">Heures du jour enregistrées.</div>';
  } else {
    html += '<div class="banner ok">Modification du ' + frDate(editDate) + (wasEdited ? ' — déjà modifié '+current.history.length+' fois' : '') + '.</div>';
  }

  var dis = lockedMonth ? ' disabled' : '';
  html +=
    '<div class="card stack">' +
      '<label style="margin-bottom:0;font-size:14px;color:var(--ink-soft);">' + (isToday ? 'Aujourd\'hui — ' : 'Modifier — ') + frDate(editDate) + '</label>' +
      '<div><label>Ou choisir un autre jour</label><input type="date" id="freeDatePick" value="'+editDate+'" max="'+today+'"></div>' +
      '<div class="grid2">' +
        '<div><label>Matin début</label><input type="time" id="mD" value="'+(current.matinDebut||(isToday?'06:00':''))+'"'+dis+'></div>' +
        '<div><label>Matin fin</label><input type="time" id="mF" value="'+(current.matinFin||'')+'"'+dis+'></div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div><label>Après-midi début</label><input type="time" id="aD" value="'+(current.apremDebut||'')+'"'+dis+'></div>' +
        '<div><label>Après-midi fin</label><input type="time" id="aF" value="'+(current.apremFin||'')+'"'+dis+'></div>' +
      '</div>' +
      '<div><label>Pause (minutes)</label><input type="number" id="pause" min="0" step="5" value="'+(current.pause!==undefined?current.pause:15)+'"'+dis+'></div>' +
      '<div><label>Commentaire (facultatif)</label><textarea id="commentaire" rows="2" style="width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;font-size:15px;background:#FBFAF6;color:var(--ink);font-family:inherit;"'+dis+'>'+(current.commentaire||'')+'</textarea></div>' +
      '<div class="total-line"><span>Total du jour</span><span class="val" id="liveTotal">—</span></div>' +
      (lockedMonth ? '' : '<button class="btn btn-gold" id="btnSave">Enregistrer</button>') +
      (isToday ? '' : '<button class="btn btn-ghost" id="btnCancelEdit">Annuler, revenir à aujourd\'hui</button>') +
    '</div>';

  var histDates = Object.keys(entries).filter(function(d){return d!==today;}).sort().reverse().slice(0,10);
  if(histDates.length){
    html += '<div class="section-title">Jours précédents — appuie pour modifier</div><div class="card">';
    histDates.forEach(function(d){
      var e = entries[d];
      var t = computeTotal(e);
      var edited = e.history && e.history.length > 0;
      var isLocked = !!validations[d.slice(0,7)];
      if(isLocked){
        html += '<div class="hist-item"><span class="hist-date">'+frDate(d)+'</span><span class="hist-total">'+(t!==null?t+' h':'—')+' 🔒</span></div>';
      } else {
        html += '<div class="hist-item" data-date="'+d+'" style="cursor:pointer;"><span class="hist-date">'+frDate(d)+(edited?' <span class="muted">(modifié)</span>':'')+(e.commentaire?' 💬':'')+'</span><span class="hist-total">'+(t!==null?t+' h':'—')+'</span></div>';
      }
    });
    html += '</div>';
  }

  app.innerHTML = html;

  document.getElementById('freeDatePick').addEventListener('change', function(){
    state.editDate = (this.value === today) ? null : this.value;
    renderWorkerDash();
  });

  function updateLive(){
    var e = {
      matinDebut: document.getElementById('mD').value,
      matinFin: document.getElementById('mF').value,
      apremDebut: document.getElementById('aD').value,
      apremFin: document.getElementById('aF').value,
      pause: document.getElementById('pause').value
    };
    var t = computeTotal(e);
    document.getElementById('liveTotal').textContent = t!==null ? t+' h' : '—';
  }
  ['mD','mF','aD','aF','pause'].forEach(function(id){
    document.getElementById(id).addEventListener('input', updateLive);
  });
  updateLive();

  document.querySelectorAll('.hist-item[data-date]').forEach(function(row){
    row.addEventListener('click', function(){
      state.editDate = row.getAttribute('data-date');
      renderWorkerDash();
    });
  });

  var cancelBtn = document.getElementById('btnCancelEdit');
  if(cancelBtn){
    cancelBtn.onclick = function(){ state.editDate = null; renderWorkerDash(); };
  }

  var btnSaveEl = document.getElementById('btnSave');
  if(btnSaveEl) btnSaveEl.onclick = async function(){
    var e = {
      matinDebut: document.getElementById('mD').value,
      matinFin: document.getElementById('mF').value,
      apremDebut: document.getElementById('aD').value,
      apremFin: document.getElementById('aF').value,
      pause: document.getElementById('pause').value,
      commentaire: document.getElementById('commentaire').value
    };
    if(!e.matinDebut || !e.matinFin){
      alert('Renseigne au moins l\'heure de début et de fin du matin.');
      return;
    }
    var now = new Date().toISOString();
    var existing = entries[editDate];
    if(existing && (existing.matinDebut || existing.matinFin || existing.apremDebut || existing.apremFin)){
      var hist = existing.history || [];
      hist.push({
        matinDebut: existing.matinDebut||'', matinFin: existing.matinFin||'',
        apremDebut: existing.apremDebut||'', apremFin: existing.apremFin||'',
        pause: existing.pause!==undefined?existing.pause:'', total: computeTotal(existing),
        remplaceLe: now
      });
      e.history = hist;
    } else if(existing && existing.history){
      e.history = existing.history;
    }
    e.modifieLe = now;
    entries[editDate] = e;
    await saveEntries(state.worker.id, entries);
    alert('Heures bien enregistrées pour le ' + frDate(editDate) + ' : ' + computeTotal(e) + ' h.');
    state.editDate = null;
    renderWorkerDash();
  };
}

async function renderWorkerRapport(){
  headerTitle.textContent = 'Rapport';
  app.innerHTML = '<p class="muted">Chargement…</p>';
  var entries = await getEntries(state.worker.id);
  var validations = await getValidations(state.worker.id);
  var today = todayISO();
  var currentYm = today.slice(0,7);

  var monthTotals = {};
  Object.keys(entries).forEach(function(d){
    var t = computeTotal(entries[d]);
    if(t){
      var ym = d.slice(0,7);
      monthTotals[ym] = round2((monthTotals[ym]||0) + t);
    }
  });
  var months = Object.keys(monthTotals).sort().reverse();
  var html = '';
  if(!months.length){
    html = '<p class="muted">Aucune heure enregistrée pour l\'instant.</p>';
  } else {
    var yearTotals = {};
    months.forEach(function(ym){
      var year = ym.slice(0,4);
      yearTotals[year] = round2((yearTotals[year]||0) + monthTotals[ym]);
    });
    var years = Object.keys(yearTotals).sort().reverse();
    html += '<div class="card">';
    years.forEach(function(y){
      html += '<div class="worker-row"><span class="worker-name">Total annuel '+y+'</span><span class="worker-hours">'+yearTotals[y]+' h</span></div>';
    });
    html += '</div>';

    var moisNoms = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    html += '<div class="section-title">Détail par mois</div><div class="card">';
    months.forEach(function(ym){
      var parts = ym.split('-');
      var label = moisNoms[parseInt(parts[1],10)-1] + ' ' + parts[0];
      var isOpen = state.expandedMonth === ym;
      var v = validations[ym];
      html += '<div class="hist-item" data-month="'+ym+'" style="cursor:pointer;"><span class="hist-date">'+label+(v?' 🔒':'')+'</span><span class="hist-total">'+monthTotals[ym]+' h &nbsp;'+(isOpen?'−':'+')+'</span></div>';
      if(isOpen){
        var daysInMonth = Object.keys(entries).filter(function(d){return d.slice(0,7)===ym;}).sort().reverse();
        html += '<div style="padding:4px 0 8px 10px;">';
        daysInMonth.forEach(function(d){
          var t = computeTotal(entries[d]);
          if(v){
            html += '<div class="hist-item" style="padding:8px 0;"><span class="hist-date">'+frDate(d)+'</span><span class="hist-total">'+(t!==null?t+' h':'—')+' 🔒</span></div>';
          } else {
            html += '<div class="hist-item" data-date="'+d+'" style="cursor:pointer;padding:8px 0;"><span class="hist-date">'+frDate(d)+'</span><span class="hist-total">'+(t!==null?t+' h':'—')+' ✎</span></div>';
          }
        });
        html += '</div>';
        if(v){
          html += '<div style="padding:10px;background:var(--green-bg);border-radius:9px;margin:0 0 10px;font-size:13px;color:var(--moss-dark);">✓ Mois validé par '+v.prenom+' le '+new Date(v.validatedAt).toLocaleString('fr-FR')+' — '+v.totalHeures+' h.</div>';
        } else if(ym !== currentYm){
          html += '<div style="padding:0 0 10px;"><button class="btn btn-gold" data-validate="'+ym+'">Valider et signer ce mois ('+monthTotals[ym]+' h)</button></div>';
        } else {
          html += '<div style="padding:0 0 10px;"><p class="muted">Le mois en cours ne peut être validé qu\'une fois terminé.</p></div>';
        }
      }
    });
    html += '</div>';
  }
  app.innerHTML = html;

  document.querySelectorAll('.hist-item[data-month]').forEach(function(row){
    row.addEventListener('click', function(){
      var ym = row.getAttribute('data-month');
      state.expandedMonth = (state.expandedMonth === ym) ? null : ym;
      renderWorkerRapport();
    });
  });
  document.querySelectorAll('.hist-item[data-date]').forEach(function(row){
    row.addEventListener('click', function(){
      state.editDate = row.getAttribute('data-date');
      state.screen = 'workerDash';
      render();
    });
  });
  document.querySelectorAll('button[data-validate]').forEach(function(btn){
    btn.onclick = async function(){
      var ym = btn.getAttribute('data-validate');
      var parts = ym.split('-');
      var moisNoms2 = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
      var label = moisNoms2[parseInt(parts[1],10)-1] + ' ' + parts[0];
      var saisie = prompt('Pour valider et signer '+label+' ('+monthTotals[ym]+' h), tape ton prénom exact ci-dessous :');
      if(!saisie) return;
      if(normalize(saisie) !== normalize(state.worker.prenom)){
        alert('Le prénom ne correspond pas, validation annulée.');
        return;
      }
      var current = await getValidations(state.worker.id);
      current[ym] = { validatedAt: new Date().toISOString(), prenom: state.worker.prenom, totalHeures: monthTotals[ym] };
      await saveValidations(state.worker.id, current);
      alert('Mois validé et signé.');
      renderWorkerRapport();
    };
  });
}

async function renderSorterEntry(){
  headerTitle.textContent = 'Tri — barquettes';
  var date = state.sorterDate || todayISO();
  app.innerHTML = '<p class="muted">Chargement…</p>';
  var list = await getBarquettes(date);
  var editIdx = state.sorterEditIdx;
  var editing = (editIdx !== null && editIdx !== undefined && list[editIdx] && list[editIdx].sorterWorkerId === state.worker.id);

  var myEntries = list.map(function(e, idx){ return {e:e, idx:idx}; }).filter(function(o){ return o.e.sorterWorkerId === state.worker.id; });

  var totalBarq = list.reduce(function(s,e){ return s + (parseInt(e.barquettes,10)||0); }, 0);
  var totalKg = round2(totalBarq * 0.125);
  var myTotalBarq = myEntries.reduce(function(s,o){ return s + (parseInt(o.e.barquettes,10)||0); }, 0);
  var myTotalKg = round2(myTotalBarq * 0.125);

  var html =
    '<div class="card stack">' +
      '<div><label>Date</label><input type="date" id="sorterDatePick" value="'+date+'" max="'+todayISO()+'"'+(editing?' disabled':'')+'></div>' +
      (editing ? '<p class="muted">Modification de la saisie sélectionnée.</p>' : '') +
      '<div class="grid2">' +
        '<div><label>N° cueilleur (1-56, ou 0 si pas de papier)</label><input type="number" id="cNum" min="0" max="56" placeholder="Ex: 12" value="'+(editing?list[editIdx].cueilleurNum:'')+'"></div>' +
        '<div><label>Nombre de barquettes</label><input type="number" id="cBarq" min="1" placeholder="Ex: 8" value="'+(editing?list[editIdx].barquettes:'')+'"></div>' +
      '</div>' +
      '<button class="btn btn-gold" id="btnAddBarq">'+(editing?'Enregistrer la modification':'Ajouter')+'</button>' +
      (editing ? '<button class="btn btn-ghost" id="btnCancelEditBarq">Annuler</button>' : '') +
    '</div>' +
    '<div class="card">' +
      '<div class="total-line" style="border-top:none;padding-top:0;"><span>Mes saisies aujourd\'hui</span><span class="val">'+myTotalBarq+' barquettes (~'+myTotalKg+' kg)</span></div>' +
      '<p class="muted" style="margin-top:8px;">Total équipe (tous trieurs) : '+totalBarq+' barquettes (~'+totalKg+' kg)</p>' +
    '</div>';

  if(myEntries.length){
    html += '<div class="section-title">Mes saisies du jour ('+myEntries.length+')</div><div class="card">';
    myEntries.slice().reverse().forEach(function(o){
      var e = o.e, idx = o.idx;
      var heure = e.timestamp ? new Date(e.timestamp).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}) : '';
      html += '<div class="hist-item"><span class="hist-date">'+cueilleurLabel(e.cueilleurNum)+' — '+e.barquettes+' barquette(s)<br><span class="muted">'+heure+'</span></span><span><button class="btn btn-ghost" style="width:auto;padding:6px 10px;" data-editidx="'+idx+'">✎</button> <button class="btn btn-ghost" style="width:auto;padding:6px 10px;color:var(--red);" data-delidx="'+idx+'">✕</button></span></div>';
    });
    html += '</div>';
  }

  app.innerHTML = html;

  document.getElementById('sorterDatePick').addEventListener('change', function(){
    state.sorterDate = this.value;
    state.sorterEditIdx = null;
    renderSorterEntry();
  });

  var cancelEditBtn = document.getElementById('btnCancelEditBarq');
  if(cancelEditBtn){
    cancelEditBtn.onclick = function(){ state.sorterEditIdx = null; renderSorterEntry(); };
  }

  document.getElementById('btnAddBarq').onclick = async function(){
    var num = parseInt(document.getElementById('cNum').value, 10);
    var barq = parseInt(document.getElementById('cBarq').value, 10);
    if(isNaN(num) || num<0 || num>56){ alert('Numéro de cueilleur invalide (0 à 56, 0 = non identifié).'); return; }
    if(!barq || barq<1){ alert('Renseigne un nombre de barquettes.'); return; }
    var current = await getBarquettes(date);
    if(editing){
      if(current[editIdx].sorterWorkerId !== state.worker.id){ alert('Cette saisie ne t\'appartient pas.'); state.sorterEditIdx=null; renderSorterEntry(); return; }
      current[editIdx].cueilleurNum = num;
      current[editIdx].barquettes = barq;
      current[editIdx].modifieLe = new Date().toISOString();
    } else {
      current.push({ cueilleurNum: num, barquettes: barq, sorterWorkerId: state.worker.id, sorterPrenom: state.worker.prenom, timestamp: new Date().toISOString() });
    }
    var ok = await saveBarquettes(date, current);
    if(!ok){ alert('Erreur : l\'enregistrement a échoué. Vérifie ta connexion et réessaie.'); return; }
    state.sorterEditIdx = null;
    renderSorterEntry();
  };

  document.querySelectorAll('button[data-editidx]').forEach(function(btn){
    btn.onclick = function(){
      state.sorterEditIdx = parseInt(btn.getAttribute('data-editidx'), 10);
      renderSorterEntry();
    };
  });

  document.querySelectorAll('button[data-delidx]').forEach(function(btn){
    btn.onclick = async function(){
      var idx = parseInt(btn.getAttribute('data-delidx'), 10);
      var current = await getBarquettes(date);
      if(current[idx] && current[idx].sorterWorkerId !== state.worker.id){ alert('Cette saisie ne t\'appartient pas.'); return; }
      current.splice(idx, 1);
      var ok = await saveBarquettes(date, current);
      if(!ok){ alert('Erreur lors de la suppression. Réessaie.'); return; }
      state.sorterEditIdx = null;
      renderSorterEntry();
    };
  });
}

async function renderAdminDash(){
  headerTitle.textContent = 'Équipe';
  app.innerHTML = '<p class="muted">Chargement…</p>';
  var workers = await getWorkers();
  workers.sort(function(a,b){ return a.prenom.localeCompare(b.prenom); });
  var monthFilter = state.adminMonthFilter || 'all';

  var entriesAll = await Promise.all(workers.map(function(w){ return getEntries(w.id); }));
  var docsAll = await Promise.all(workers.map(function(w){ return getDocuments(w.id); }));

  var totalsHtml = '';
  var allData = [];
  var mods = [];
  var allMonthsSet = {};
  var docStatusHtml = '';
  var moisNomsFilter = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  for(var i=0;i<workers.length;i++){
    var w = workers[i];
    var entries = entriesAll[i];
    var wdocs = docsAll[i];
    var totalH = 0;
    var totalHFiltered = 0;
    var monthsWorked = {};
    var days = Object.keys(entries);
    days.forEach(function(d){
      var entry = entries[d];
      var t = computeTotal(entry);
      if(t){
        totalH += t;
        var ym = d.slice(0,7);
        allMonthsSet[ym] = true;
        monthsWorked[ym] = true;
        if(monthFilter==='all' || ym===monthFilter) totalHFiltered += t;
      }
      if(entry.history && entry.history.length){
        entry.history.forEach(function(h){
          mods.push({ prenom: w.prenom, jour: d, ancienTotal: h.total, nouveauTotal: computeTotal(entry), quand: h.remplaceLe });
        });
      }
    });
    allData.push({worker:w, entries:entries, totalH: round2(totalH)});
    totalsHtml += '<div class="worker-row" data-wid="'+w.id+'" style="cursor:pointer;"><span class="worker-name">'+w.prenom+'<br><span class="muted" style="font-weight:400;font-size:12px;">né(e) le '+frDate(w.dob)+'</span></span><span class="worker-hours">'+round2(totalHFiltered)+' h ›</span></div>';

    var monthKeys = Object.keys(monthsWorked).sort();
    var docMonthLabels = {};
    wdocs.forEach(function(doc){ if(doc.periodLabel) docMonthLabels[doc.periodLabel] = true; });

    docStatusHtml += '<div class="worker-row" style="align-items:flex-start;"><span class="worker-name">'+w.prenom+'</span>';
    if(!monthKeys.length){
      docStatusHtml += '<span class="muted">aucune heure saisie</span></div>';
    } else {
      docStatusHtml += '<span style="text-align:right;">';
      monthKeys.forEach(function(ym){
        var parts = ym.split('-');
        var label = moisNomsFilter[parseInt(parts[1],10)-1].normalize('NFD').replace(/[\u0300-\u036f]/g,'') + '-' + parts[0];
        var displayLabel = moisNomsFilter[parseInt(parts[1],10)-1] + ' ' + parts[0];
        var has = !!docMonthLabels[label];
        docStatusHtml += '<span style="display:block;font-size:13px;color:'+(has?'var(--moss)':'var(--red)')+';">'+(has?'✓':'✗')+' '+displayLabel+'</span>';
      });
      docStatusHtml += '</span></div>';
    }
  }

  if(!workers.length){ totalsHtml = '<p class="muted">Aucun salarié n\'a encore de compte.</p>'; docStatusHtml = '<p class="muted">Aucun salarié pour l\'instant.</p>'; }

  var allMonthsList = Object.keys(allMonthsSet).sort().reverse();
  var monthFilterOptions = '<option value="all"'+(monthFilter==='all'?' selected':'')+'>Tous les mois (total général)</option>' +
    allMonthsList.map(function(ym){
      var parts = ym.split('-');
      var label = moisNomsFilter[parseInt(parts[1],10)-1] + ' ' + parts[0];
      return '<option value="'+ym+'"'+(monthFilter===ym?' selected':'')+'>'+label+'</option>';
    }).join('');

  mods.sort(function(a,b){ return (b.quand||'').localeCompare(a.quand||''); });
  var modsHtml = '';
  if(mods.length){
    mods.forEach(function(m){
      var quandStr = m.quand ? new Date(m.quand).toLocaleString('fr-FR') : '—';

async function renderAdminWorkerDetail(){

  app.innerHTML = '<p class="muted">Chargement…</p>';

  var validations = await getValidations(w.id);
  var editDate = state.adminEditDate || todayISO();
  var current = entries[editDate] || {};

    html += '<div class="banner">Attention : ce mois a été validé et signé par '+lockedMonth.prenom+' le '+new Date(lockedMonth.validatedAt).toLocaleDateString('fr-FR')+'. Toute correction restera tracée dans l\'historique.</div>';
  }
  html +=
    '<div class="card stack">' +
      '<label style="margin-bottom:0;font-size:14px;color:var(--ink-soft);">Modifier — ' + frDate(editDate) + (wasEdited ? ' (déjà modifié '+current.history.length+' fois)' : '') + '</label>' +
      '<div><label>Choisir un jour</label><input type="date" id="adminDatePick" value="'+editDate+'"></div>' +
      '<div class="grid2">' +
        '<div><label>Matin début</label><input type="time" id="mD" value="'+(current.matinDebut||'')+'"></div>' +

  var allDates = Object.keys(entries).sort().reverse();
  if(allDates.length){
    html += '<div class="section-title">Tous les jours saisis — appuie pour modifier</div><div class="card">';
    allDates.forEach(function(d){

    docs.slice().sort(function(a,b){ return (b.uploadedAt||'').localeCompare(a.uploadedAt||''); }).forEach(function(d){

      docsHtml += '<div class="doc-item"><span>'+d.name+'<br><span class="muted">'+dateStr+'</span></span><button class="btn btn-ghost" style="width:auto;padding:8px 14px;color:var(--red);" data-delid="'+d.id+'">Supprimer</button></div>';
    });

  document.getElementById('btnUploadDoc').onclick = async function(){
    var fileInput = document.getElementById('docFile');
    var file = fileInput.files[0];
    if(!file){ alert('Choisis un fichier d\'abord.'); return; }
    var periodLabel = null;
    var payroll = { netAPayer: null, cotisations: null, heuresBulletin: null };
    if(file.type === 'application/pdf' && window.pdfjsLib){
      var text = await extractPdfText(file);
      if(text){ periodLabel = extractPeriodLabel(text); payroll = extractPayrollInfo(text); }
    }
    if(!periodLabel){
      var moisNoms = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
      var now = new Date();
      periodLabel = moisNoms[now.getMonth()] + '-' + now.getFullYear();
    }
    var ext = file.name.split('.').pop();
    var niceName = 'Bulletin_'+w.prenom+'_'+periodLabel+'.'+ext;
    var base64 = await fileToBase64(file);
    var current = await getDocuments(w.id);
    current.push({ id: 'doc-'+Date.now(), name: niceName, type: file.type || 'application/octet-stream', data: base64, uploadedAt: new Date().toISOString(), periodLabel: periodLabel, netAPayer: payroll.netAPayer, cotisations: payroll.cotisations, heuresBulletin: payroll.heuresBulletin });
    await saveDocuments(w.id, current);
    renderAdminWorkerDetail();
  };
  document.querySelectorAll('button[data-delid]').forEach(function(btn){
    btn.onclick = async function(){
      var id = btn.getAttribute('data-delid');
      var current = await getDocuments(w.id);
      current = current.filter(function(d){ return d.id !== id; });
      await saveDocuments(w.id, current);
      renderAdminWorkerDetail();
    };
  });

  document.getElementById('btnDeleteWorker').onclick = async function(){
    var sure = confirm('Supprimer définitivement '+w.prenom+' et toutes ses heures enregistrées ? Cette action est irréversible.');
    if(!sure) return;
    var updated = workers.filter(function(x){ return x.id !== w.id; });
    await saveWorkers(updated);
    await saveEntries(w.id, {});
    await saveDocuments(w.id, []);
    state.screen = 'adminDash';
    render();
  };

  document.getElementById('isTrieurCheck').addEventListener('change', async function(){
    w.isTrieur = this.checked;
    await saveWorkers(workers);
  });
  document.getElementById('numCueilleurInput').addEventListener('change', async function(){
    var v = parseInt(this.value, 10);
    w.numeroCueilleur = (v>=1 && v<=56) ? v : null;
    await saveWorkers(workers);
  });

  document.getElementById('btnBackAdmin').onclick = function(){
    state.screen = 'adminDash';
    render();
  };

  document.getElementById('adminDatePick').addEventListener('change', function(){
    state.adminEditDate = this.value;
    renderAdminWorkerDetail();
  });

  function updateLive(){
    var e = {
      matinDebut: document.getElementById('mD').value,
      matinFin: document.getElementById('mF').value,
      apremDebut: document.getElementById('aD').value,
      apremFin: document.getElementById('aF').value,
      pause: document.getElementById('pause').value
    };
    var t = computeTotal(e);
    document.getElementById('liveTotal').textContent = t!==null ? t+' h' : '—';
  }
  ['mD','mF','aD','aF','pause'].forEach(function(id){
    document.getElementById(id).addEventListener('input', updateLive);
  });
  updateLive();

  document.querySelectorAll('.hist-item[data-date]').forEach(function(row){
    row.addEventListener('click', function(){
      state.adminEditDate = row.getAttribute('data-date');
      renderAdminWorkerDetail();
    });
  });

  document.getElementById('btnSave').onclick = async function(){
    var e = {
      matinDebut: document.getElementById('mD').value,
      matinFin: document.getElementById('mF').value,
      apremDebut: document.getElementById('aD').value,
      apremFin: document.getElementById('aF').value,
      pause: document.getElementById('pause').value,
      commentaire: document.getElementById('commentaire').value
    };
    if(!e.matinDebut || !e.matinFin){
      alert('Renseigne au moins l\'heure de début et de fin du matin.');
      return;
    }
    var now = new Date().toISOString();
    var existing = entries[editDate];
    if(existing && (existing.matinDebut || existing.matinFin || existing.apremDebut || existing.apremFin)){
      var hist = existing.history || [];
      hist.push({
        matinDebut: existing.matinDebut||'', matinFin: existing.matinFin||'',
        apremDebut: existing.apremDebut||'', apremFin: existing.apremFin||'',
        pause: existing.pause!==undefined?existing.pause:'', total: computeTotal(existing),
        remplaceLe: now, modifiePar: 'Responsable'
      });
      e.history = hist;
    } else if(existing && existing.history){
      e.history = existing.history;
    }
    e.modifieLe = now;
    e.modifiePar = 'Responsable';
    entries[editDate] = e;
    await saveEntries(w.id, entries);
    renderAdminWorkerDetail();
  };
}

async function renderAdminBulkImport(){
  headerTitle.textContent = 'Import en masse';
  var workers = await getWorkers();
  workers.sort(function(a,b){ return a.prenom.localeCompare(b.prenom); });

  var optionsHtml = '<option value="">— non trouvé, choisir —</option>' +
    workers.map(function(w){ return '<option value="'+w.id+'">'+w.prenom+'</option>'; }).join('');

  app.innerHTML =
    '<button class="btn btn-ghost" id="btnBackBulk">‹ Retour au menu</button>' +
    '<div class="card stack">' +
      '<div><label>Sélectionner les fichiers (plusieurs à la fois)</label><input type="file" id="bulkFiles" multiple></div>' +
      '<p class="muted">Astuce : nomme les fichiers avec le prénom du salarié (ex: Bulletin_Marie_Juillet.pdf) pour une reconnaissance automatique.</p>' +
    '</div>' +
    '<div id="bulkList"></div>';

  document.getElementById('btnBackBulk').onclick = function(){ state.screen='adminMenu'; render(); };

  document.getElementById('bulkFiles').addEventListener('change', async function(e){
    var files = Array.from(e.target.files);
    document.getElementById('bulkList').innerHTML = '<p class="muted">Analyse des fichiers en cours…</p>';

    var detections = [];
    for(var i=0;i<files.length;i++){
      var file = files[i];
      var match = null;
      var periodLabel = null;
      var payroll = { netAPayer: null, cotisations: null, heuresBulletin: null };
      if(file.type === 'application/pdf' && window.pdfjsLib){
        var text = await extractPdfText(file);
        if(text){
          match = findWorkerInText(text, workers);
          periodLabel = extractPeriodLabel(text);
          payroll = extractPayrollInfo(text);
        }
      }
      if(!match){
        var nameNorm = normalize(file.name);
        match = workers.find(function(w){ return w.key && nameNorm.indexOf(w.key) !== -1; });
      }
      detections.push({ file: file, match: match, periodLabel: periodLabel, payroll: payroll });
    }

    var rowsHtml = detections.map(function(d, i){
      var opts = optionsHtml.replace('value="'+(d.match?d.match.id:'__none__')+'"', 'value="'+(d.match?d.match.id:'')+'" selected');
      return '<div class="doc-item" style="align-items:center;">' +
        '<span style="flex:1;">'+d.file.name+(d.match?' <span class="muted">→ '+d.match.prenom+'</span>':'')+'</span>' +
        '<select data-fileidx="'+i+'" style="max-width:140px;padding:8px;border-radius:8px;border:1px solid var(--line);">' +
          opts +
        '</select>' +
      '</div>';
    }).join('');

    document.getElementById('bulkList').innerHTML =
      '<div class="card">' + rowsHtml + '</div>' +
      '<button class="btn btn-gold" id="btnDoImport">Importer '+files.length+' document(s)</button>' +
      '<div id="bulkResult" class="muted" style="text-align:center;margin-top:8px;"></div>';

    document.getElementById('btnDoImport').onclick = async function(){
      var selects = document.querySelectorAll('select[data-fileidx]');
      var byWorker = {};
      var skipped = 0;
      for(var i=0;i<selects.length;i++){
        var wid = selects[i].value;
        var d = detections[i];
        if(!wid){ skipped++; continue; }
        if(!byWorker[wid]) byWorker[wid] = [];
        byWorker[wid].push(d);
      }
      var resultEl = document.getElementById('bulkResult');
      resultEl.textContent = 'Import en cours…';
      var count = 0;
      for(var wid in byWorker){
        var current = await getDocuments(wid);
        var worker = workers.find(function(w){ return w.id === wid; });
        for(var j=0;j<byWorker[wid].length;j++){
          var d = byWorker[wid][j];
          var base64 = await fileToBase64(d.file);
          var ext = d.file.name.split('.').pop();
          var pLabel = d.periodLabel;
          if(!pLabel){
            var moisNoms2 = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
            var now2 = new Date();
            pLabel = moisNoms2[now2.getMonth()] + '-' + now2.getFullYear();
          }
          var niceName = worker ? 'Bulletin_'+worker.prenom+'_'+pLabel+'.'+ext : d.file.name;
          current.push({ id: 'doc-'+Date.now()+'-'+j, name: niceName, type: d.file.type || 'application/octet-stream', data: base64, uploadedAt: new Date().toISOString(), periodLabel: pLabel, netAPayer: d.payroll.netAPayer, cotisations: d.payroll.cotisations, heuresBulletin: d.payroll.heuresBulletin });
          count++;
        }
        await saveDocuments(wid, current);
      }
      resultEl.textContent = count + ' document(s) importé(s)' + (skipped ? ', ' + skipped + ' ignoré(s) (pas de salarié choisi)' : '') + '.';
    };
  });
}

async function renderAdminPayroll(){
  headerTitle.textContent = 'Virements & cotisations';
  app.innerHTML = '<p class="muted">Chargement…</p>';
  var workers = await getWorkers();
  workers.sort(function(a,b){ return a.prenom.localeCompare(b.prenom); });

  var docsAll = await Promise.all(workers.map(function(w){ return getDocuments(w.id); }));
  var entriesAll = await Promise.all(workers.map(function(w){ return getEntries(w.id); }));

  var rows = [];
  var totalNet = 0, totalCot = 0;
  for(var i=0;i<workers.length;i++){
    var w = workers[i];
    var docs = docsAll[i];
    var withPay = docs.filter(function(d){ return d.netAPayer !== null && d.netAPayer !== undefined; });
    withPay.sort(function(a,b){ return (b.uploadedAt||'').localeCompare(a.uploadedAt||''); });
    var latest = withPay[0] || null;

    var entries = entriesAll[i];
    var heuresMois = null;
    if(latest && latest.periodLabel){
      var parts = latest.periodLabel.split('-');
      var moisNoms = ['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
      var mi = moisNoms.indexOf(parts[0]);
      if(mi !== -1){
        var ym = parts[1] + '-' + String(mi+1).padStart(2,'0');
        heuresMois = 0;
        Object.keys(entries).forEach(function(d){ if(d.slice(0,7)===ym){ var t=computeTotal(entries[d]); if(t) heuresMois += t; } });
        heuresMois = round2(heuresMois);
      }
    }

    if(latest){ totalNet += latest.netAPayer||0; totalCot += latest.cotisations||0; }
    rows.push({ prenom: w.prenom, doc: latest, heuresMois: heuresMois });
  }
  totalNet = round2(totalNet); totalCot = round2(totalCot);

  var html = '<p class="muted" style="margin-bottom:14px;">Montants extraits automatiquement des derniers bulletins importés pour chaque salarié — à vérifier avant tout virement, l\'extraction peut se tromper selon la mise en page du bulletin.</p>';
  html += '<div class="card">';
  rows.forEach(function(r){
    if(!r.doc){
      html += '<div class="worker-row"><span class="worker-name">'+r.prenom+'</span><span class="muted">aucun bulletin importé</span></div>';
    } else {
      html += '<div class="worker-row" style="align-items:flex-start;">' +
        '<span class="worker-name">'+r.prenom+'<br><span class="muted" style="font-weight:400;font-size:12px;">'+(r.doc.periodLabel||'')+(r.heuresMois!==null?' — '+r.heuresMois+' h (app)':'')+(r.doc.heuresBulletin?' / '+r.doc.heuresBulletin+' h (bulletin)':'')+'</span></span>' +
        '<span style="text-align:right;">' +
          '<span class="worker-hours" style="display:block;">'+(r.doc.netAPayer!==null?r.doc.netAPayer+' €':'—')+'</span>' +
          '<span class="muted" style="font-size:12px;">cotis. '+(r.doc.cotisations!==null?r.doc.cotisations+' €':'—')+'</span>' +
        '</span>' +
      '</div>';
    }
  });
  html += '</div>';

  html += '<div class="card">' +
    '<div class="worker-row"><span class="worker-name">Total à virer</span><span class="worker-hours">'+totalNet+' €</span></div>' +
    '<div class="worker-row"><span class="worker-name">Total cotisations (MSA et autres)</span><span class="worker-hours">'+totalCot+' €</span></div>' +
  '</div>';

  html += '<button class="btn btn-gold" id="btnExportPayroll">Exporter en Excel</button>';
  html += '<button class="btn btn-ghost" id="btnBackPayroll">‹ Retour au menu</button>';

  app.innerHTML = html;

  document.getElementById('btnBackPayroll').onclick = function(){ state.screen='adminMenu'; render(); };
  document.getElementById('btnExportPayroll').onclick = function(){
    var wb = XLSX.utils.book_new();
    var data = [['Prénom','Période','Heures (app)','Heures (bulletin)','Net à virer (€)','Cotisations (€)']];
    rows.forEach(function(r){
      data.push([r.prenom, r.doc?r.doc.periodLabel||'':'', r.heuresMois!==null?r.heuresMois:'', r.doc?r.doc.heuresBulletin||'':'', r.doc?r.doc.netAPayer||'':'', r.doc?r.doc.cotisations||'':'']);
    });
    data.push([]);
    data.push(['TOTAL','','','', totalNet, totalCot]);
    var ws = XLSX.utils.aoa_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, 'Virements');
    XLSX.writeFile(wb, 'Virements_'+todayISO()+'.xlsx');
  };
}

async function renderAdminBarquettes(){
  headerTitle.textContent = 'Suivi barquettes';
  var date = state.adminBarqDate || todayISO();
  app.innerHTML = '<p class="muted">Chargement…</p>';
  var list = await getBarquettes(date);
  var allWorkers = await getWorkers();
  var trieurWorkers = allWorkers.filter(function(w){ return w.isTrieur; });

  var byCueilleur = {};
  list.forEach(function(e){
    byCueilleur[e.cueilleurNum] = (byCueilleur[e.cueilleurNum]||0) + (parseInt(e.barquettes,10)||0);
  });
  var cueilleurNums = Object.keys(byCueilleur).map(Number).sort(function(a,b){return a-b;});
  var totalBarq = list.reduce(function(s,e){ return s + (parseInt(e.barquettes,10)||0); }, 0);
  var totalKg = round2(totalBarq * 0.125);

  var byTrieur = {};
  list.forEach(function(e){
    var k = e.sorterWorkerId || e.sorterPrenom;
    if(!byTrieur[k]) byTrieur[k] = { workerId: e.sorterWorkerId||null, prenom: e.sorterPrenom, barq: 0 };
    byTrieur[k].barq += (parseInt(e.barquettes,10)||0);
  });
  var trieurKeys = Object.keys(byTrieur);
  for(var i=0;i<trieurKeys.length;i++){
    var t = byTrieur[trieurKeys[i]];
    t.kg = round2(t.barq * 0.125);
    t.heures = null;
    t.kgH = null;
    if(t.workerId){
      var wentries = await getEntries(t.workerId);
      var jourEntry = wentries[date];
      var h = jourEntry ? computeTotal(jourEntry) : null;
      if(h){ t.heures = h; t.kgH = round2(t.kg / h); }
    }
  }

  var html =
    '<button class="btn btn-ghost" id="btnBackBarq">‹ Retour au menu</button>' +
    '<div class="card stack" style="margin-top:14px;">' +
      '<div><label>Date</label><input type="date" id="barqDatePick" value="'+date+'" max="'+todayISO()+'"></div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="worker-row"><span class="worker-name">Total barquettes</span><span class="worker-hours">'+totalBarq+'</span></div>' +
      '<div class="worker-row"><span class="worker-name">Équivalent kg (x0,125)</span><span class="worker-hours">'+totalKg+' kg</span></div>' +

  function parseDateCell(v){
    if(v instanceof Date){
      return v.toISOString().slice(0,10);
    }
    if(typeof v === 'number'){
      var d = new Date(Math.round((v - 25569) * 86400 * 1000));
      return d.toISOString().slice(0,10);
    }
    var s = String(v||'').trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    return null;
  }
  function parseTimeCell(v){
    if(v===undefined || v===null || v==='') return '';
    if(typeof v === 'number'){
      var totalMin = Math.round(v*24*60);
      var h = Math.floor(totalMin/60), mn = totalMin%60;
      return String(h).padStart(2,'0')+':'+String(mn).padStart(2,'0');
    }
    var s = String(v).trim();
    var m = s.match(/^(\d{1,2}):(\d{2})/);
    if(m) return m[1].padStart(2,'0')+':'+m[2];
    return '';
  }

function isoWeekKey(dateISO){
  var d = new Date(dateISO+'T00:00:00Z');
  var day = (d.getUTCDay()+6)%7; // lundi=0
  d.setUTCDate(d.getUTCDate()-day+3);
  var firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  var week = 1 + Math.round(((d-firstThursday)/86400000 - 3 + ((firstThursday.getUTCDay()+6)%7))/7);
  var monday = new Date(dateISO+'T00:00:00Z');
  monday.setUTCDate(monday.getUTCDate() - ((monday.getUTCDay()+6)%7));
  return d.getUTCFullYear()+'-S'+String(week).padStart(2,'0')+'|'+monday.toISOString().slice(0,10);
}
function computeOvertimeWeeks(entries){
  var byWeek = {};
  Object.keys(entries).forEach(function(day){
    var t = computeTotal(entries[day]);
    if(!t) return;
    var wk = isoWeekKey(day);
    byWeek[wk] = round2((byWeek[wk]||0) + t);
  });
  var weeks = Object.keys(byWeek).sort();
  return weeks.map(function(wk){
    var total = byWeek[wk];
    var normales = Math.min(total, 35);
    var sup25 = Math.min(Math.max(total-35, 0), 8);
    var sup50 = Math.max(total-43, 0);
    var parts = wk.split('|');
    return { semaine: parts[0], debutSemaine: parts[1], total: total, normales: round2(normales), sup25: round2(sup25), sup50: round2(sup50) };
  });
}

function computeMonthlyRecap(entries){
  var byMonth = {};
  Object.keys(entries).forEach(function(day){
    var t = computeTotal(entries[day]);
    if(!t) return;
    var ym = day.slice(0,7);
    if(!byMonth[ym]) byMonth[ym] = { heures: 0, jours: 0 };
    byMonth[ym].heures = round2(byMonth[ym].heures + t);
    byMonth[ym].jours += 1;
  });
  var months = Object.keys(byMonth).sort();
  var moisNoms = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  return months.map(function(ym){
    var parts = ym.split('-');
    var label = moisNoms[parseInt(parts[1],10)-1] + ' ' + parts[0];
    return { label: label, heures: byMonth[ym].heures, jours: byMonth[ym].jours };
  });
}

async function renderAdminSecteurs(){
  headerTitle.textContent = 'Secteurs';
  app.innerHTML = '<p class="muted">Chargement…</p>';
  var secteurs = await getSecteurs();
  if(!secteurs.length){
    secteurs = [];
    for(var i=1;i<=10;i++){ secteurs.push({ num:i, variete:'', datePlantation:'', potsParLigne:0, nombreLignes:0, lateralesParPlant:0, fruitsParLaterale:0, poidsMoyenFruit:0 }); }
  } else {
    // Migration douce depuis l'ancien format (pots/lateraux uniques)
    secteurs.forEach(function(s){
      if(s.potsParLigne===undefined){ s.potsParLigne = s.pots||0; s.nombreLignes = s.pots?1:0; }
      if(s.lateralesParPlant===undefined){ s.lateralesParPlant = s.lateraux||0; }
      if(s.datePlantation===undefined) s.datePlantation = '';
      if(s.fruitsParLaterale===undefined) s.fruitsParLaterale = 0;
      if(s.poidsMoyenFruit===undefined) s.poidsMoyenFruit = 0;
    });
  }
  secteurs.sort(function(a,b){ return a.num-b.num; });

  function calcPlants(s){ return (parseFloat(s.potsParLigne)||0) * (parseFloat(s.nombreLignes)||0); }
  function calcRendement(s){
    var plants = calcPlants(s);
    var kg = plants * (parseFloat(s.lateralesParPlant)||0) * (parseFloat(s.fruitsParLaterale)||0) * (parseFloat(s.poidsMoyenFruit)||0) / 1000;
    return round2(kg);
  }

  var html = '<button class="btn btn-ghost" id="btnBackSecteurs">‹ Retour à l\'agronomie</button>';
  html += '<p class="muted" style="margin:10px 0;">Renseigne les informations de chaque secteur — le nombre de plants et le rendement prévisionnel se calculent automatiquement.</p>';
  secteurs.forEach(function(s, idx){
    html += '<div class="card stack">' +
      '<div class="worker-name">Secteur '+s.num+'</div>' +
      '<div><label>Variété</label><input type="text" data-idx="'+idx+'" data-f="variete" value="'+(s.variete||'')+'" placeholder="Ex: Kwanza"></div>' +
      '<div><label>Date de plantation</label><input type="date" data-idx="'+idx+'" data-f="datePlantation" value="'+(s.datePlantation||'')+'"></div>' +
      '<div class="grid2">' +
        '<div><label>Pots par ligne</label><input type="number" min="0" data-idx="'+idx+'" data-f="potsParLigne" data-calc="'+idx+'" value="'+(s.potsParLigne||0)+'"></div>' +
        '<div><label>Nombre de lignes</label><input type="number" min="0" data-idx="'+idx+'" data-f="nombreLignes" data-calc="'+idx+'" value="'+(s.nombreLignes||0)+'"></div>' +
      '</div>' +
      '<div class="total-line" style="border-top:none;padding-top:0;"><span>Nombre de plants</span><span class="val" id="plants-'+idx+'" style="font-size:18px;">'+calcPlants(s)+'</span></div>' +
      '<div class="grid2">' +
        '<div><label>Latérales / plant</label><input type="number" min="0" data-idx="'+idx+'" data-f="lateralesParPlant" data-calc="'+idx+'" value="'+(s.lateralesParPlant||0)+'"></div>' +
        '<div><label>Fruits / latérale</label><input type="number" min="0" data-idx="'+idx+'" data-f="fruitsParLaterale" data-calc="'+idx+'" value="'+(s.fruitsParLaterale||0)+'"></div>' +
      '</div>' +
      '<div><label>Poids moyen d\'un fruit (g)</label><input type="number" min="0" step="0.1" data-idx="'+idx+'" data-f="poidsMoyenFruit" data-calc="'+idx+'" value="'+(s.poidsMoyenFruit||0)+'"></div>' +

    '</div>';
  });

  app.innerHTML = html;

      var s = secteurs[idx];

        var f = i2.getAttribute('data-f');
        if(f && f!=='variete' && f!=='datePlantation') s[f] = parseFloat(i2.value)||0;
      });
      document.getElementById('plants-'+idx).textContent = calcPlants(s);

    });

    document.getElementById('ventePdfReview').innerHTML = html2;

    document.querySelectorAll('#ventePdfReview input[data-f]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var idx = parseInt(this.getAttribute('data-idx'),10);
        var f = this.getAttribute('data-f');
        lignes[idx][f] = this.value;
      });
    });

    document.getElementById('btnConfirmVenteImport').onclick = async function(){
      var current = await getBonsApport();
      var count = 0;
      lignes.forEach(function(l){
        var kg = parseFloat(l.kg)||0;
        var prix = parseFloat(l.prixKg)||0;
        if(!kg) return;
        current.push({ date: l.date, variete: l.variete||'', kg: kg, prixKg: prix, montant: round2(kg*prix), importeLe: new Date().toISOString(), importeDePdf: true });
        count++;
      });
      var ok = await saveBonsApport(current);
      var confirmEl = document.getElementById('venteConfirmResult');
      confirmEl.textContent = ok ? (count + ' ligne(s) importée(s) avec succès.') : 'Erreur lors de l\'enregistrement.';
      if(ok) renderAdminVentes();
    };
  }

  document.getElementById('btnImportVentes').onclick = async function(){
    var file = document.getElementById('venteFile').files[0];
    var resultEl = document.getElementById('venteResult');
    if(!file){ alert('Choisis un fichier.'); return; }
    resultEl.textContent = 'Lecture du fichier…';
    try{
      var buf = await file.arrayBuffer();
      var wb = XLSX.read(buf, { type: 'array' });
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });
      var current = await getBonsApport();
      var count = 0;
      for(var i=1;i<rows.length;i++){
        var row = rows[i] || [];
        if(!row.length || !row[0]) continue;
        var dateVal = row[0];
        var dateStr;
        if(dateVal instanceof Date){ dateStr = dateVal.toISOString().slice(0,10); }
        else if(typeof dateVal === 'number'){ dateStr = new Date(Math.round((dateVal-25569)*86400*1000)).toISOString().slice(0,10); }
        else { var m = String(dateVal).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); dateStr = m ? m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0') : String(dateVal); }
        var variete = row[1] || '';
        var kg = parseFloat(row[2]) || 0;
        var prix = parseFloat(row[3]) || 0;
        if(!kg) continue;
        current.push({ date: dateStr, variete: variete, kg: kg, prixKg: prix, montant: round2(kg*prix), importeLe: new Date().toISOString() });
        count++;
      }
      var ok = await saveBonsApport(current);
      if(!ok){ resultEl.textContent = 'Erreur lors de l\'enregistrement.'; return; }
      resultEl.textContent = count + ' ligne(s) importée(s).';
      renderAdminVentes();
    }catch(err){
      resultEl.textContent = 'Erreur : ' + err.message;
    }
  };

  var exportBtn = document.getElementById('btnExportVentes');
  if(exportBtn) exportBtn.onclick = function(){
    var wb = XLSX.utils.book_new();
    var rows = [['Date','Variété','Kg','Prix €/kg','Montant €']];
    bons.slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); }).forEach(function(b){
      rows.push([frDate(b.date), b.variete, b.kg, b.prixKg, b.montant]);
    });
    rows.push([]);
    rows.push(['TOTAL','', totalKg, '', totalMontant]);
    var ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, 'Ventes');
    XLSX.writeFile(wb, 'Ventes_'+todayISO()+'.xlsx');
  };
}

async function renderAdminAgroVue(){
  headerTitle.textContent = 'Vue agronomique';
  app.innerHTML = '<p class="muted">Chargement…</p>';
  var groupBy = state.agroVueGroupBy || 'secteur';
  var days = state.agroVueDays || 30;

  var secteurs = await getSecteurs();
  var secteurMap = {};
  secteurs.forEach(function(s){ secteurMap[s.num] = s; });

  var today = new Date(todayISO()+'T00:00:00Z');
  var fromDate = new Date(today);
  fromDate.setUTCDate(fromDate.getUTCDate() - days + 1);

  var entries = [];
  var cursor = new Date(fromDate);
  var dateList = [];
  while(cursor <= today){
    dateList.push(cursor.toISOString().slice(0,10));
    cursor.setUTCDate(cursor.getUTCDate()+1);
  }
  var logsPerDate = await Promise.all(dateList.map(function(d){ return getParcelleLog(d); }));
  logsPerDate.forEach(function(list, i){
    list.forEach(function(l){ entries.push(Object.assign({}, l, { date: dateList[i] })); });
  });

  var groups = {};
  entries.forEach(function(e){
    var key = (groupBy==='secteur') ? ('Secteur '+e.secteur) : ((secteurMap[e.secteur]&&secteurMap[e.secteur].variete)||'Variété non renseignée (secteur '+e.secteur+')');
    if(!groups[key]) groups[key] = { ecs:[], phs:[], irrigations:[], count:0 };
    if(e.ec!==null && e.ec!==undefined) groups[key].ecs.push(e.ec);
    if(e.ph!==null && e.ph!==undefined) groups[key].phs.push(e.ph);
    if(e.irrigation!==null && e.irrigation!==undefined) groups[key].irrigations.push(e.irrigation);
    groups[key].count++;
  });

  function avg(arr){ return arr.length ? round2(arr.reduce(function(a,b){return a+b;},0)/arr.length) : null; }

  var groupKeys = Object.keys(groups).sort();
  var maxEc = Math.max.apply(null, groupKeys.map(function(k){ return avg(groups[k].ecs)||0; }).concat([1]));
  var maxPh = 14;

  var html = '<button class="btn btn-ghost" id="btnBackVue">‹ Retour à l\'agronomie</button>';
  html += '<div class="card stack" style="margin-top:14px;">' +
    '<div><label>Grouper par</label><select id="vueGroupBy">' +
      '<option value="secteur"'+(groupBy==='secteur'?' selected':'')+'>Secteur</option>' +
      '<option value="variete"'+(groupBy==='variete'?' selected':'')+'>Variété</option>' +
    '</select></div>' +
    '<div><label>Période</label><select id="vueDays">' +
      '<option value="7"'+(days===7?' selected':'')+'>7 derniers jours</option>' +
      '<option value="30"'+(days===30?' selected':'')+'>30 derniers jours</option>' +
      '<option value="90"'+(days===90?' selected':'')+'>90 derniers jours</option>' +
    '</select></div>' +
  '</div>';

  if(!groupKeys.length){
    html += '<p class="muted">Aucune donnée de calendrier parcelle sur cette période.</p>';
  } else {
    groupKeys.forEach(function(k){
      var g = groups[k];
      var ecAvg = avg(g.ecs);
      var phAvg = avg(g.phs);
      var irrigTotal = round2(g.irrigations.reduce(function(a,b){return a+b;},0));
      html += '<div class="card stack">' +
        '<div class="worker-name">'+k+'<br><span class="muted" style="font-weight:400;font-size:12px;">'+g.count+' saisie(s) sur la période</span></div>';
      if(ecAvg!==null){
        html += '<div><label style="margin-bottom:4px;">EC moyen : '+ecAvg+' mS/cm</label>' +
          '<div style="background:var(--line);border-radius:6px;height:10px;overflow:hidden;"><div style="width:'+Math.min(100, (ecAvg/maxEc)*100)+'%;background:var(--gold);height:100%;"></div></div></div>';
      }
      if(phAvg!==null){
        html += '<div><label style="margin-bottom:4px;">pH moyen : '+phAvg+'</label>' +
          '<div style="background:var(--line);border-radius:6px;height:10px;overflow:hidden;"><div style="width:'+Math.min(100, (phAvg/maxPh)*100)+'%;background:var(--moss);height:100%;"></div></div></div>';
      }
      if(g.irrigations.length){
        html += '<div class="muted">Irrigation cumulée : '+irrigTotal+'</div>';
      }
      if(ecAvg===null && phAvg===null && !g.irrigations.length){
        html += '<p class="muted">Pas de mesure EC/pH/irrigation sur la période.</p>';
      }
      html += '</div>';
    });
  }

  app.innerHTML = html;

  document.getElementById('btnBackVue').onclick = function(){ state.screen='adminAgroMenu'; render(); };
  document.getElementById('vueGroupBy').addEventListener('change', function(){
    state.agroVueGroupBy = this.value;
    renderAdminAgroVue();
  });
  document.getElementById('vueDays').addEventListener('change', function(){
    state.agroVueDays = parseInt(this.value,10);
    renderAdminAgroVue();
  });
}

async function renderAdminRythme(){
  headerTitle.textContent = 'Rythme de cueillette';
  var date = state.rythmeDate || todayISO();
  var sortBy = state.rythmeSortBy || 'kg';
  app.innerHTML = '<p class="muted">Chargement…</p>';
  var workers = await getWorkers();
  var numToWorker = {};
  workers.forEach(function(w){ if(w.numeroCueilleur) numToWorker[w.numeroCueilleur] = w; });

  var dateList = [];
  var d0 = new Date(date+'T00:00:00Z');
  for(var i=6;i>=0;i--){ var dd = new Date(d0); dd.setUTCDate(dd.getUTCDate()-i); dateList.push(dd.toISOString().slice(0,10)); }
  var listsPerDay = await Promise.all(dateList.map(function(dd){ return getBarquettes(dd); }));

  var perCueilleurPerDay = {};
  listsPerDay.forEach(function(list, di){
    list.forEach(function(e){
      var num = e.cueilleurNum;
      if(num===0 || num===undefined || num===null) return;
      if(!perCueilleurPerDay[num]) perCueilleurPerDay[num] = new Array(7).fill(0);
      perCueilleurPerDay[num][di] = round2(perCueilleurPerDay[num][di] + (parseFloat(e.barquettes)||0)*0.125);
    });
  });

  var allNums = Object.keys(perCueilleurPerDay).map(Number);

  var kgHByNum = {};
  for(var i=0;i<allNums.length;i++){
    var n = allNums[i];
    var w = numToWorker[n];
    if(w){
      var entries = await getEntries(w.id);
      var dayEntry = entries[date];
      var heures = dayEntry ? computeTotal(dayEntry) : null;
      var todayKg = perCueilleurPerDay[n][6]||0;
      kgHByNum[n] = (heures && heures>0) ? round2(todayKg/heures) : null;
    } else {
      kgHByNum[n] = null;
    }
  }

  var nums = allNums.sort(function(a,b){
    if(sortBy==='kgh'){
      var kgHa = kgHByNum[a], kgHb = kgHByNum[b];
      if(kgHa===null && kgHb===null) return (perCueilleurPerDay[b][6]||0)-(perCueilleurPerDay[a][6]||0);
      if(kgHa===null) return 1;
      if(kgHb===null) return -1;
      return kgHb - kgHa;
    }
    return (perCueilleurPerDay[b][6]||0) - (perCueilleurPerDay[a][6]||0);
  });

  var html = '<button class="btn btn-ghost" id="btnBackRythme">‹ Retour au menu</button>';
  html += '<div class="card stack" style="margin-top:14px;">' +
    '<div><label>Date</label><input type="date" id="rythmeDatePick" value="'+date+'" max="'+todayISO()+'"></div>' +
    '<div><label>Classement décroissant par</label><select id="rythmeSortPick">' +
      '<option value="kg"'+(sortBy==='kg'?' selected':'')+'>Kg du jour</option>' +
      '<option value="kgh"'+(sortBy==='kgh'?' selected':'')+'>Kg/h (rendement)</option>' +
    '</select></div>' +
  '</div>';
  html += '<p class="muted" style="margin:0 0 10px;">Numéros visibles ici uniquement — jamais côté trieur ni côté salarié. Le kg/h se calcule uniquement pour les cueilleurs reliés à un compte, à partir de leurs heures pointées ce jour-là.</p>';

  if(!nums.length){
    html += '<p class="muted">Aucune saisie de tri sur les 7 derniers jours.</p>';
  } else {
    var maxKg = Math.max.apply(null, nums.map(function(n){ return Math.max.apply(null, perCueilleurPerDay[n]); }).concat([0.1]));
    html += '<div class="card">';
    nums.forEach(function(n, rank){
      var w = numToWorker[n];
      var label = w ? w.prenom : ('N°'+n+' (compte non lié)');
      var todayKg = round2(perCueilleurPerDay[n][6]||0);
      var kgH = kgHByNum[n];
      var bars = perCueilleurPerDay[n].map(function(kg){
        var h = Math.max(2, Math.round((kg/maxKg)*28));
        return '<div style="width:9px;height:'+h+'px;background:var(--gold);border-radius:2px;display:inline-block;margin-right:2px;vertical-align:bottom;"></div>';
      }).join('');
      html += '<div class="worker-row" style="align-items:center;">' +
        '<span class="worker-name">'+(rank+1)+'. '+label+'<br><span class="muted" style="font-weight:400;font-size:11px;">tendance 7 jours</span></span>' +
        '<span style="text-align:right;">' +
          '<div style="height:30px;">'+bars+'</div>' +
          '<span class="muted" style="font-size:12px;">'+todayKg+' kg — '+(kgH!==null?kgH+' kg/h':'kg/h non calculable')+'</span>' +
        '</span>' +
      '</div>';
    });
    html += '</div>';
    html += '<button class="btn btn-gold" id="btnExportRythme">Exporter en Excel</button>';
  }

  app.innerHTML = html;
  document.getElementById('btnBackRythme').onclick = function(){ state.screen='adminMenu'; render(); };
  document.getElementById('rythmeDatePick').addEventListener('change', function(){
    state.rythmeDate = this.value;
    renderAdminRythme();
  });
  document.getElementById('rythmeSortPick').addEventListener('change', function(){
    state.rythmeSortBy = this.value;
    renderAdminRythme();
  });

  var exportBtn = document.getElementById('btnExportRythme');
  if(exportBtn) exportBtn.onclick = function(){
    var wb = XLSX.utils.book_new();
    var rows = [['Rang','Cueilleur','N°','Kg du jour','Kg/h', dateList[0]+' (kg)', dateList[1]+' (kg)', dateList[2]+' (kg)', dateList[3]+' (kg)', dateList[4]+' (kg)', dateList[5]+' (kg)', dateList[6]+' (kg)']];
    nums.forEach(function(n, rank){
      var w = numToWorker[n];
      var label = w ? w.prenom : 'Non lié';
      var row = [rank+1, label, n, round2(perCueilleurPerDay[n][6]||0), kgHByNum[n]!==null?kgHByNum[n]:''];
      perCueilleurPerDay[n].forEach(function(kg){ row.push(kg); });
      rows.push(row);
    });
    var ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, 'Rythme cueillette');
    XLSX.writeFile(wb, 'Rythme_cueillette_'+date+'.xlsx');
  };
}

function exportExcel(allData, mods){
  var wb = XLSX.utils.book_new();
  var recap = [['Prénom','Date de naissance','Total heures','Nombre de jours travaillés','Dont heures sup 125%','Dont heures sup 150%']];
  var overtimeRows = [['Prénom','Semaine','Début de semaine','Total heures','Heures normales (≤35h)','Heures sup 125% (35-43h)','Heures sup 150% (>43h)']];
  var monthlyRows = [['Prénom','Mois','Total heures','Nombre de jours travaillés']];
  allData.forEach(function(d){
    var weeks = computeOvertimeWeeks(d.entries);
    var totalSup25 = 0, totalSup50 = 0;
    weeks.forEach(function(w){
      totalSup25 += w.sup25;
      totalSup50 += w.sup50;
      overtimeRows.push([d.worker.prenom, w.semaine, frDate(w.debutSemaine), w.total, w.normales, w.sup25, w.sup50]);
    });
    var totalJours = Object.keys(d.entries).filter(function(day){ return computeTotal(d.entries[day]); }).length;
    recap.push([d.worker.prenom, d.worker.dob, d.totalH, totalJours, round2(totalSup25), round2(totalSup50)]);

    var months = computeMonthlyRecap(d.entries);
    months.forEach(function(m){
      monthlyRows.push([d.worker.prenom, m.label, m.heures, m.jours]);
    });
  });
  var wsRecap = XLSX.utils.aoa_to_sheet(recap);
  XLSX.utils.book_append_sheet(wb, wsRecap, 'RECAP');

  var wsMonthly = XLSX.utils.aoa_to_sheet(monthlyRows);
  XLSX.utils.book_append_sheet(wb, wsMonthly, 'Récap mensuel');

  var wsOvertime = XLSX.utils.aoa_to_sheet(overtimeRows);
  XLSX.utils.book_append_sheet(wb, wsOvertime, 'Heures sup par semaine');

  allData.forEach(function(d){
    var rows = [['Date','Matin début','Matin fin','Après-midi début','Après-midi fin','Pause (min)','Total jour','Modifié','Commentaire']];
    var days = Object.keys(d.entries).sort();
    days.forEach(function(day){
      var e = d.entries[day];
      var edited = e.history && e.history.length ? 'Oui ('+e.history.length+')' : 'Non';
      rows.push([frDate(day), e.matinDebut||'', e.matinFin||'', e.apremDebut||'', e.apremFin||'', e.pause||0, computeTotal(e), edited, e.commentaire||'']);
    });
    var sheetName = d.worker.prenom.substring(0,28) || 'Salarié';
    var ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });

  var modRows = [['Prénom','Jour concerné','Ancien total','Nouveau total','Modifié le']];
  (mods||[]).forEach(function(m){
    modRows.push([m.prenom, frDate(m.jour), m.ancienTotal, m.nouveauTotal, m.quand ? new Date(m.quand).toLocaleString('fr-FR') : '']);
  });
  var wsMods = XLSX.utils.aoa_to_sheet(modRows);
  XLSX.utils.book_append_sheet(wb, wsMods, 'Modifications');

  var today = todayISO();
  XLSX.writeFile(wb, 'Pointage_'+today+'.xlsx');
}

render();
